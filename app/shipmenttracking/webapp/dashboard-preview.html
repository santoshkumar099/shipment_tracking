
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipment Dashboard Preview</title>

    <script
        id="sap-ui-bootstrap"
        src="https://sapui5.hana.ondemand.com/1.153.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-async="true"
        data-sap-ui-compat-version="edge"
        data-sap-ui-resource-roots='{
            "shipment.tracking.shipmenttracking": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport">
    </script>
</head>

<body class="sapUiBody sapUiSizeCompact">
    <div
        data-sap-ui-component
        data-name="shipment.tracking.shipmenttracking.ext.dashboard"
        data-id="dashboard-container"
        data-settings='{"id":"shipment-dashboard-preview"}'>
    </div>
</body>
</html>
